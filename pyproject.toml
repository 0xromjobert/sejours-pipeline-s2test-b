[project]
name = "sejours-pipeline"
version = "0.1.0"
description = "Pipeline des séjours hospitaliers : CSV -> validation -> DuckDB (données fictives)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "pydantic>=2.14.3",
]

[project.scripts]
sejours-pipeline = "sejours_pipeline:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 88
